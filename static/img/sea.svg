<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <!-- うみ: 空・太陽・水平線のある海・砂浜。波ではなく「海」だとわかる遠景 -->
  <rect x="0" y="0" width="200" height="140" rx="16" fill="#bfe6ff"/>
  <circle cx="156" cy="38" r="16" fill="#ffc933"/>
  <ellipse cx="52" cy="34" rx="22" ry="10" fill="#fff"/>
  <ellipse cx="66" cy="28" rx="14" ry="9" fill="#fff"/>
  <!-- 海: 水平線から手前へ -->
  <path d="M0 62 H200 V112 C160 106 140 118 100 114 C60 110 40 120 0 116 Z" fill="#2f8fdc"/>
  <path d="M0 62 H200 V80 C160 76 130 84 100 80 C70 76 40 84 0 80 Z" fill="#3aa0f0"/>
  <!-- 白い波がしら（小さく、遠近をつける） -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <path d="M28 88 q6 -5 12 0 q6 5 12 0"/>
    <path d="M110 92 q6 -5 12 0 q6 5 12 0"/>
    <path d="M62 104 q8 -6 16 0 q8 6 16 0"/>
    <path d="M148 102 q6 -5 12 0"/>
  </g>
  <!-- ヨット -->
  <path d="M124 70 L124 46 L140 70 Z" fill="#fff"/>
  <path d="M121 70 L121 52 L110 70 Z" fill="#ff7043"/>
  <path d="M106 72 H146 L140 79 H112 Z" fill="#5d4037"/>
  <!-- カモメ -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <path d="M18 50 q5 -6 10 0 q5 -6 10 0"/>
    <path d="M88 42 q4 -5 8 0 q4 -5 8 0"/>
  </g>
  <!-- 砂浜 -->
  <path d="M0 116 C40 120 60 110 100 114 C140 118 160 106 200 112 V140 H0 Z" fill="#f6dd9a"/>
  <path d="M0 122 C40 126 60 116 100 120 C140 124 160 112 200 118 V140 H0 Z" fill="#f0cf7e"/>
  <circle cx="40" cy="130" r="2" fill="#e0b860"/>
  <circle cx="150" cy="128" r="2.5" fill="#e0b860"/>
  <circle cx="90" cy="133" r="2" fill="#e0b860"/>
</svg>
